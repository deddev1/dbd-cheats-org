# CI Workers Builds project name (repo: the-isle-hacks-.org → Worker: the-isle-hacks--org)
name = "theislehacks"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Local/CLI deploy: Wrangler runs this before upload. Workers Builds also uses postinstall.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://theislehacks.org 301s always apply
run_worker_first = true
